---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows
    uses: ./.github/workflows/build-windows.yml
    with:
      cold_cache: true

  publish:
    name: Publish release
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Refuse to change an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:GITHUB_REF_NAME already exists. Published assets are immutable. Tag a new version."
          }
          exit 0

      - name: Download packages and SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: NexaMap-Editor-Windows-*
          path: release-assets
          merge-multiple: true

      - name: Compute SHA256 checksums
        shell: pwsh
        run: |
          Set-Location release-assets
          $archives = @(Get-ChildItem -File -Filter 'NexaMap-Editor-Windows-*-Release.zip')
          $sboms = @(Get-ChildItem -File -Filter 'NexaMap-Editor-Windows-*-SBOM.zip')
          if ($archives.Count -ne 2 -or $sboms.Count -ne 2) {
            throw "Expected two archives and two SBOMs, found $($archives.Count) and $($sboms.Count)."
          }
          $checksums = foreach ($file in ($archives + $sboms | Sort-Object Name)) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content -Encoding ascii SHA256SUMS.txt
          $checksums >> $env:GITHUB_STEP_SUMMARY

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | Sort-Object Name | Select-Object -ExpandProperty FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --repo $env:GITHUB_REPOSITORY
          exit $LASTEXITCODE
