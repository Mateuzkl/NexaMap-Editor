---
name: Build Windows

on:
  workflow_dispatch:
  # Tagged releases call this workflow from release.yml with cold_cache enabled.
  workflow_call:
    inputs:
      cold_cache:
        description: Build without restoring any dependency or compiler cache.
        type: boolean
        default: false
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-windows.yml"
      - "CMakeLists.txt"
      - "CMakeSettings.json"
      - "vcpkg.json"
      - "cmake/**"
      - "source/**"
      - "tests/**"
      - "vcproj/**"
      - "brushes/**"
      - "data/**"
      - "extensions/**"
      - "icons/**"
      - "packaging/**"
      - "tools/**"
      - "LICENSE.rtf"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/build-windows.yml"
      - "CMakeLists.txt"
      - "CMakeSettings.json"
      - "vcpkg.json"
      - "cmake/**"
      - "source/**"
      - "tests/**"
      - "vcproj/**"
      - "brushes/**"
      - "data/**"
      - "extensions/**"
      - "icons/**"
      - "packaging/**"
      - "tools/**"
      - "LICENSE.rtf"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Windows ${{ matrix.arch }} Release
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            msvc_arch: x86
            triplet: x86-windows-static
          - arch: x64
            msvc_arch: amd64
            triplet: x64-windows-static

    env:
      BUILD_DIR: build-${{ matrix.arch }}
      PACKAGE_DIR: package-${{ matrix.arch }}
      ARCHIVE_NAME: NexaMap-Editor-Windows-${{ matrix.arch }}-Release.zip
      NEXAMAP_VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}\vcpkg-downloads\${{ matrix.arch }}
      # A release must not inherit packages from a shared cache.
      VCPKG_BINARY_SOURCES: ${{ inputs.cold_cache && 'clear' || format('clear;files,{0}\vcpkg-binary-cache\{1},readwrite', github.workspace, matrix.arch) }}
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_LOG: warn
      SCCACHE_ERROR_LOG: ${{ github.workspace }}\build-${{ matrix.arch }}\diagnostics\sccache.log
      COLD_CACHE: ${{ inputs.cold_cache }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure MSVC for ${{ matrix.arch }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Identify compiler cache namespace
        id: toolchain
        shell: pwsh
        run: |
          "version=$env:VCToolsVersion" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg caches
        id: vcpkg-cache
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vcpkg-binary-cache/${{ matrix.arch }}
            vcpkg-downloads/${{ matrix.arch }}
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('vcpkg.json') }}

          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.version }}-
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Initialize diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:BUILD_DIR/diagnostics" | Out-Null
          @{
            commit = '${{ github.sha }}'
            architecture = '${{ matrix.arch }}'
            runnerImage = $env:ImageVersion
            compilerToolset = $env:VCToolsVersion
            vcpkgBaseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
            dependencyCacheHit = '${{ steps.vcpkg-cache.outputs.cache-hit }}'
          } | ConvertTo-Json | Set-Content "$env:BUILD_DIR/diagnostics/environment.json"
          "### Windows ${{ matrix.arch }} build stages" >> $env:GITHUB_STEP_SUMMARY
          "| Stage | Exit code | Seconds |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | --- | --- |" >> $env:GITHUB_STEP_SUMMARY

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if (-not $baseline) {
            throw 'vcpkg.json does not define builtin-baseline.'
          }

          New-Item -ItemType Directory -Force $env:NEXAMAP_VCPKG_ROOT | Out-Null
          git -C $env:NEXAMAP_VCPKG_ROOT init
          git -C $env:NEXAMAP_VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg.git
          git -C $env:NEXAMAP_VCPKG_ROOT fetch --depth 1 origin $baseline
          git -C $env:NEXAMAP_VCPKG_ROOT checkout --detach FETCH_HEAD
          & "$env:NEXAMAP_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed with exit code $LASTEXITCODE."
          }

          New-Item -ItemType Directory -Force $env:VCPKG_DOWNLOADS | Out-Null
          $binaryCache = Join-Path $env:GITHUB_WORKSPACE "vcpkg-binary-cache\${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $binaryCache | Out-Null

      - name: Set up compiler cache
        if: ${{ !inputs.cold_cache }}
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure CMake
        id: configure
        shell: pwsh
        run: |
          cl 2>&1 | Select-Object -First 3
          cmake --version
          ninja --version

          $compilerCache = if ($env:COLD_CACHE -eq 'true') { @() } else {
            @('-DCMAKE_C_COMPILER_LAUNCHER=sccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=sccache')
          }

          & ./cmake/InvokeBuildStage.ps1 configure cmake -CommandArguments (@(
            '-S', '.', '-B', $env:BUILD_DIR, '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_TOOLCHAIN_FILE=$env:NEXAMAP_VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake",
            '-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}',
            '-DBUILD_TESTING=ON', '-DENABLE_UNITY_BUILD=ON'
          ) + $compilerCache)
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed with exit code $LASTEXITCODE."
          }

      - name: Save vcpkg caches
        if: ${{ !inputs.cold_cache && steps.configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vcpkg-binary-cache/${{ matrix.arch }}
            vcpkg-downloads/${{ matrix.arch }}
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('vcpkg.json') }}

      - name: Build Release
        shell: pwsh
        run: |
          & ./cmake/InvokeBuildStage.ps1 build cmake -CommandArguments @('--build', $env:BUILD_DIR, '--config', 'Release', '--parallel', $env:NUMBER_OF_PROCESSORS)
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE."
          }

      - name: Run tests
        shell: pwsh
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/diagnostics/tests.xml"
          & ./cmake/InvokeBuildStage.ps1 test ctest -CommandArguments @('--test-dir', $env:BUILD_DIR, '--build-config', 'Release', '--output-on-failure', '--parallel', $env:NUMBER_OF_PROCESSORS, '--timeout', '120', '--no-tests=error', '--output-junit', $report)
          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
            throw "CTest did not produce its JUnit report: $report"
          }

      - name: Install runtime package
        shell: pwsh
        run: |
          & ./cmake/InvokeBuildStage.ps1 install cmake -CommandArguments @('--install', $env:BUILD_DIR, '--config', 'Release', '--prefix', $env:PACKAGE_DIR)
          if ($LASTEXITCODE -ne 0) {
            throw "CMake install failed with exit code $LASTEXITCODE."
          }

          $runtimeBin = Join-Path $env:BUILD_DIR "vcpkg_installed\${{ matrix.triplet }}\bin"
          if (Test-Path $runtimeBin) {
            Get-ChildItem $runtimeBin -Filter '*.dll' -File | Copy-Item -Destination $env:PACKAGE_DIR -Force
          }

      - name: Validate architecture and package
        id: package
        shell: pwsh
        run: |
          & .\cmake\ValidateWindowsPackage.ps1 `
            -Architecture '${{ matrix.arch }}' `
            -PackageDirectory $env:PACKAGE_DIR `
            -ArchivePath $env:ARCHIVE_NAME

          $archive = Get-Item $env:ARCHIVE_NAME
          "archive_size_bytes=$($archive.Length)" >> $env:GITHUB_OUTPUT
          "### Windows ${{ matrix.arch }} package" >> $env:GITHUB_STEP_SUMMARY
          "- Triplet: ``${{ matrix.triplet }}``" >> $env:GITHUB_STEP_SUMMARY
          "- Archive: ``$env:ARCHIVE_NAME``" >> $env:GITHUB_STEP_SUMMARY
          "- Size: $([math]::Round($archive.Length / 1MB, 2)) MiB" >> $env:GITHUB_STEP_SUMMARY

      - name: Show executable dependencies
        shell: pwsh
        run: |
          $executable = Join-Path $env:PACKAGE_DIR 'NexaMap Editor.exe'
          $dumpbinOutput = dumpbin /dependents $executable
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed with exit code $LASTEXITCODE."
          }
          $dumpbinOutput | Out-Host

          $dependencies = @($dumpbinOutput | ForEach-Object {
            if ($_ -match '^\s+([A-Za-z0-9_.-]+\.dll)\s*$') {
              $Matches[1]
            }
          } | Sort-Object -Unique)
          $systemDirectory = if ('${{ matrix.arch }}' -eq 'x86') {
            Join-Path $env:SystemRoot 'SysWOW64'
          } else {
            Join-Path $env:SystemRoot 'System32'
          }
          foreach ($dependency in $dependencies) {
            $packaged = Test-Path -LiteralPath (Join-Path $env:PACKAGE_DIR $dependency)
            $system = Test-Path -LiteralPath (Join-Path $systemDirectory $dependency)
            if (-not ($packaged -or $system)) {
              throw "Runtime dependency is missing from the package and Windows: $dependency"
            }
          }

      - name: Collect dependency SBOM
        if: ${{ inputs.cold_cache }}
        shell: pwsh
        run: |
          $installed = Join-Path $env:BUILD_DIR "vcpkg_installed\${{ matrix.triplet }}\share"
          $sbomDirectory = "sbom-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $sbomDirectory | Out-Null
          $documents = @(Get-ChildItem $installed -Recurse -Filter 'vcpkg.spdx.json' -File)
          if ($documents.Count -eq 0) {
            throw 'vcpkg did not produce any SPDX documents.'
          }
          foreach ($document in $documents) {
            Copy-Item -LiteralPath $document.FullName -Destination (Join-Path $sbomDirectory "$($document.Directory.Name).spdx.json")
          }
          Compress-Archive -Path "$sbomDirectory/*" -DestinationPath 'NexaMap-Editor-Windows-${{ matrix.arch }}-SBOM.zip'

      - name: Record compiler cache statistics
        if: ${{ always() && !inputs.cold_cache }}
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            & ./cmake/InvokeBuildStage.ps1 compiler-cache sccache -CommandArguments @('--show-stats')
          }

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-${{ matrix.arch }}-diagnostics
          path: |
            ${{ env.BUILD_DIR }}/diagnostics/
            ${{ env.BUILD_DIR }}/CMakeCache.txt
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.BUILD_DIR }}/Testing/Temporary/
            ${{ env.BUILD_DIR }}/vcpkg-manifest-install.log
            .vcpkg/buildtrees/**/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Upload ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NexaMap-Editor-Windows-${{ matrix.arch }}-Release
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ${{ matrix.arch }} SBOM
        if: ${{ inputs.cold_cache }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NexaMap-Editor-Windows-${{ matrix.arch }}-SBOM
          path: NexaMap-Editor-Windows-${{ matrix.arch }}-SBOM.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
