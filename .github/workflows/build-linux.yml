---
name: Build Linux

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-linux.yml"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "cmake/**"
      - "source/**"
      - "tests/**"
      - "tools/**"
      - "packaging/**"
      - "brushes/**"
      - "data/**"
      - "extensions/**"
      - "icons/**"
  pull_request:
    paths:
      - ".github/workflows/build-linux.yml"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "cmake/**"
      - "source/**"
      - "tests/**"
      - "tools/**"
      - "packaging/**"
      - "brushes/**"
      - "data/**"
      - "extensions/**"
      - "icons/**"

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Ubuntu ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 24.04 Release
            build_dir: build/ci-release
            extra_args: ""
            smoke: true
          - name: 24.04 ASan and UBSan
            build_dir: build/ci-sanitizers
            extra_args: --sanitize
            smoke: false

    env:
      # Under Xvfb a missing GL or xdotool is a broken job, not a skipped test.
      NEXAMAP_REQUIRE_GL_TESTS: "1"
      NEXAMAP_REQUIRE_NATIVE_INPUT_TESTS: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        shell: bash
        run: bash tools/build-linux.sh --print-deps | bash

      - name: Keep ASan compatible with the runner's ASLR setting
        if: ${{ matrix.extra_args == '--sanitize' }}
        shell: bash
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'cmake/prepare_linux_wx.cmake') }}
          restore-keys: vcpkg-linux-

      - name: Build and test under Xvfb
        id: build
        shell: bash
        run: bash tools/build-linux.sh --tests --jobs 4 --build-dir "${{ matrix.build_dir }}" ${{ matrix.extra_args }}

      - name: Save vcpkg binary cache
        if: ${{ always() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'cmake/prepare_linux_wx.cmake') }}

      - name: Run GUI smoke test
        if: ${{ matrix.smoke }}
        shell: bash
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x960x24' bash tools/linux-gui-smoke.sh \
            "${{ matrix.build_dir }}/install/bin/NexaMap Editor" smoke-output \
            "${{ matrix.build_dir }}/linux_gui_capture"

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Linux-${{ strategy.job-index }}-diagnostics
          path: |
            ${{ matrix.build_dir }}/Testing/Temporary/
            ${{ matrix.build_dir }}/vcpkg-manifest-install.log
            smoke-output/
          if-no-files-found: warn
          retention-days: 7
