name: Build Linux

on:
  workflow_dispatch:
  push:
    branches: [master, main, 'fix/linux-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Ubuntu ${{ matrix.version }} Release
    runs-on: ubuntu-${{ matrix.version }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ['22.04', '24.04']
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.cache/vcpkg-binaries,readwrite'
      VCPKG_DOWNLOADS: '${{ github.workspace }}/.cache/vcpkg-downloads'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      SCCACHE_LOG: warn
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: System dependencies
        shell: bash
        run: bash tools/build-linux.sh --print-deps | bash
      - uses: actions/cache@v4
        with:
          path: |
            .cache/vcpkg-binaries
            .cache/vcpkg-downloads
          key: linux-${{ matrix.version }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake', 'cmake/prepare_linux_wx.cmake') }}
          restore-keys: linux-${{ matrix.version }}-
      - name: Set up compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: 'v0.16.0'
      - name: Environment
        shell: bash
        run: |
          mkdir -p build/diagnostics .cache/vcpkg-binaries .cache/vcpkg-downloads
          { date -u; git rev-parse HEAD; cat /etc/os-release; uname -m; g++ --version; pkg-config --modversion gtk+-3.0; } > build/diagnostics/environment.log
      - name: Full editor, tests, install and Debian package
        shell: bash
        run: |
          set -o pipefail
          bash tools/build-linux.sh --build-dir "$PWD/build/linux release" --tests --package --jobs 2 2>&1 | tee build/diagnostics/build.log
      - name: Install package and inspect runtime dependencies
        shell: bash
        run: |
          sudo apt-get install -y ./build/linux\ release/packages/*.deb
          ldd '/usr/bin/NexaMap Editor' | tee build/diagnostics/ldd.log
          ! grep -q 'not found' build/diagnostics/ldd.log
          desktop-file-validate /usr/share/applications/nexamap-editor.desktop
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x960x24' \
            bash tools/linux-gui-smoke.sh '/usr/bin/NexaMap Editor' build/diagnostics/gui 'build/linux release/linux_gui_capture'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NexaMap-Ubuntu-${{ matrix.version }}
          path: |
            build/diagnostics/
            build/linux release/Testing/
            build/linux release/packages/*.deb
          if-no-files-found: warn
